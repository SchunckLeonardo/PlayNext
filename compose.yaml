name: playnext-local
services:
  app:
    build:
      context: .
      dockerfile: local/Dockerfile
    image: playnext-local:2.1.0
    ports:
      - "127.0.0.1:4173:4173"
    env_file: .local/app.env
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4173/__local/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
